name: aldivine-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust fmt/clippy/test/build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --locked

  native-audit:
    name: native dependency audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - run: cargo run -p ald -- dependencies audit-native

  e2e:
    name: vertical e2e (non-GTA)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - run: cargo test -p ald-server --features lua --test vertical_e2e
      - run: cargo test -p ald-server --features lua --lib

  web:
    name: aegis web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aegis/web/package-lock.json
      - run: npm ci
      - run: npm run build
