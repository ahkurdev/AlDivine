[workspace]
resolver = "2"
members = [
  "crates/ald-core",
  "crates/ald-config",
  "crates/ald-protocol",
  "crates/ald-identity",
  "crates/ald-entitlement",
  "crates/ald-device-identity",
  "crates/ald-events",
  "crates/ald-rpc",
  "crates/ald-resource",
  "crates/ald-scheduler",
  "crates/ald-permissions",
  "crates/ald-telemetry",
  "crates/ald-network",
  "crates/ald-ecs",
  "crates/ald-security",
  "crates/ald-servercfg",
  "crates/ald-database",
  "crates/ald-compat",
  "crates/ald-audit",
  "crates/ald-script-lua",
  "crates/ald-script-js",
  "crates/ald-script-node",
  "crates/ald-script-dotnet",
  "crates/ald-replication",
  "crates/ald-serialization-compat",
  "crates/ald-package",
  "apps/novagate",
  "aegis/backend",
  "crates/acl-esx",
  "crates/acl-qbcore",
  "crates/acl-qbox",
  "crates/ald-db-capability",
  "crates/ald-timesync",
  "crates/ald-negotiation",
  "crates/ald-query",
  "crates/ald-edge",
  "crates/ald-vfs",
  "crates/ald-fxmanifest",
  "crates/ald-cfxlua-compat",
  "client/astryn",
  "framework/aldivine",
  "server/ald-server",
  "cli/ald",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aldivine"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
ulid = { version = "1", features = ["serde"] }
hmac = "0.12"
sha1 = "0.10"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
