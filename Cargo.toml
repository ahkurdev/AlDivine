[workspace]
resolver = "2"
members = [
  "crates/ald-core",
  "crates/ald-config",
  "crates/ald-protocol",
  "crates/ald-identity",
  "crates/ald-entitlement",
  "crates/ald-device-identity",
  "crates/ald-events",
  "crates/ald-rpc",
  "crates/ald-resource",
  "crates/ald-scheduler",
  "crates/ald-permissions",
  "crates/ald-telemetry",
  "crates/ald-network",
  "crates/ald-ecs",
  "crates/ald-security",
  "crates/ald-servercfg",
  "crates/ald-database",
  "crates/ald-compat",
  "crates/ald-audit",
  "crates/ald-script-lua",
  "crates/ald-script-js",
  "crates/ald-script-node",
  "crates/ald-script-dotnet",
  "crates/ald-native-extension",
  "crates/ald-native-extension-testext",
  "crates/ald-replication",
  "crates/ald-serialization-compat",
  "crates/ald-package",
  "crates/ald-package-scanner",
  "crates/ald-backup",
  "crates/ald-upgrade-planner",
  "crates/ald-symbol-service",
  "crates/ald-replay",
  "crates/ald-updater",
  "crates/ald-ha",
  "crates/ald-sharding",
  "crates/ald-compat-lab",
  "apps/novagate",
  "aegis/backend",
  "agent/aegis-node",
  "crates/acl-esx",
  "crates/acl-qbcore",
  "crates/acl-qbox",
  "crates/ald-db-capability",
  "crates/ald-timesync",
  "crates/ald-negotiation",
  "crates/ald-query",
  "crates/ald-edge",
  "crates/ald-vfs",
  "crates/ald-fxmanifest",
  "crates/ald-cfxlua-compat",
  "crates/ald-queue",
  "crates/ald-deferrals",
  "crates/ald-game-editions",
  "crates/ald-game-builds",
  "crates/ald-state",
  "crates/ald-statebag-compat",
  "crates/ald-asset-registry",
  "crates/ald-datafiles",
  "crates/ald-snapshot",
  "crates/ald-persistence",
  "crates/ald-population",
  "crates/ald-game-events",
  "crates/ald-lagcomp",
  "crates/ald-download",
  "crates/ald-cache",
  "crates/ald-mount",
  "crates/ald-residency",
  "crates/ald-streaming",
  "crates/ald-buckets",
  "crates/ald-nui",
  "crates/ald-input",
  "crates/ald-dui",
  "crates/ald-voice",
  "client/astryn",
  "client/simulation-client",
  "framework/aldivine",
  "server/ald-server",
  "cli/ald",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aldivine"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
ulid = { version = "1", features = ["serde"] }
hmac = "0.12"
sha1 = "0.10"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
